<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Campus Helpdesk — Triage</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #121519;
    --panel-2: #15181d;
    --line: #22262c;
    --text: #e7e9ec;
    --text-dim: #8b929c;
    --text-faint: #565d67;
    --accent: #5fd0a3;
    --amber: #e0a94d;
    --red: #e2685f;
    --mono: "SF Mono", "IBM Plex Mono", "Menlo", monospace;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --r: 8px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px rgba(95,208,163,0.15); }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  header .sub { font-family: var(--mono); font-size: 10.5px; color: var(--text-faint); letter-spacing: 0.04em; }
  .status-pill {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; color: var(--text-dim);
    border: 1px solid var(--line); border-radius: 20px; padding: 4px 10px 4px 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .status-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  .main { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr); min-height: 0; }
  @media (max-width: 860px) { .main { grid-template-columns: 1fr; } .ledger-col { display: none; } }

  .chat-col { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
  .thread { flex: 1; overflow-y: auto; padding: 22px 22px 8px; display: flex; flex-direction: column; gap: 14px; }
  .thread::-webkit-scrollbar { width: 8px; }
  .thread::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .msg { max-width: 72%; display: flex; flex-direction: column; gap: 5px; animation: rise .18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.agent { align-self: flex-start; align-items: flex-start; }
  .bubble { padding: 10px 14px; border-radius: var(--r); font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; }
  .bubble strong { color: var(--accent); font-weight: 600; }
  .bubble a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .bubble a:hover { opacity: 0.8; }
  .msg.user .bubble { background: var(--accent); color: #06110c; border-bottom-right-radius: 2px; font-weight: 500; }
  .msg.user .bubble strong { color: #06110c; }
  .msg.agent .bubble { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 2px; }
  .msg-tag {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 3px; opacity: 0.9; display: inline-flex; align-items: center; gap: 4px;
  }
  .msg-tag::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }
  .msg-tag.answered { color: var(--accent); background: rgba(95,208,163,0.1); }
  .msg-tag.clarifying { color: var(--amber); background: rgba(224,169,77,0.1); }
  .msg-tag.escalated { color: var(--red); background: rgba(226,104,95,0.1); }

  .source-pill {
    font-family: var(--mono); font-size: 10px; color: var(--text-dim);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px;
    padding: 5px 9px; margin-top: 2px; display: inline-flex; align-items: center; gap: 6px;
  }
  .source-pill::before { content: "◇"; color: var(--accent); }

  .typing-bubble { display: flex; gap: 4px; padding: 12px 14px; }
  .typing-bubble span { width: 5px; height: 5px; border-radius: 50%; background: var(--text-faint); animation: blink 1.2s infinite; }
  .typing-bubble span:nth-child(2) { animation-delay: .15s; }
  .typing-bubble span:nth-child(3) { animation-delay: .3s; }

  .suggestions { padding: 10px 22px; display: flex; gap: 7px; flex-wrap: wrap; border-top: 1px solid var(--line); }
  .suggestions button {
    font-size: 11.5px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px;
    padding: 6px 12px; cursor: pointer; color: var(--text-dim); font-family: var(--sans);
    transition: border-color .12s, color .12s;
  }
  .suggestions button:hover { border-color: var(--accent); color: var(--text); }

  .composer { padding: 14px 22px 18px; display: flex; gap: 8px; }
  .composer input {
    flex: 1; font-size: 13.5px; padding: 11px 14px; border: 1px solid var(--line); border-radius: var(--r);
    font-family: var(--sans); background: var(--panel); color: var(--text);
  }
  .composer input::placeholder { color: var(--text-faint); }
  .composer input:focus { outline: none; border-color: var(--accent); }
  .composer button {
    font-family: var(--sans); font-size: 13px; font-weight: 600; background: var(--accent); color: #06110c;
    border: none; width: 42px; height: 42px; border-radius: var(--r); cursor: pointer; transition: opacity .12s, transform .1s;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0;
  }
  .composer button svg { width: 18px; height: 18px; }
  .composer button:hover { opacity: 0.85; }
  .composer button:active { transform: scale(0.94); }
  .composer button:disabled { opacity: 0.4; cursor: default; }

  .ledger-col { display: flex; flex-direction: column; min-height: 0; background: var(--panel-2); }
  .ledger-header { padding: 16px 20px 12px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: baseline; }
  .ledger-header h2 { font-size: 12.5px; font-weight: 600; margin: 0 0 3px; }
  .ledger-header p { font-family: var(--mono); font-size: 10.5px; color: var(--text-faint); margin: 0; }
  .ledger-count { font-family: var(--mono); font-size: 10px; color: var(--text-faint); }
  .ledger-body { flex: 1; overflow-y: auto; padding: 14px 20px; display: flex; flex-direction: column; gap: 10px; }
  .ledger-body::-webkit-scrollbar { width: 8px; }
  .ledger-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .trace-entry { border: 1px solid var(--line); border-radius: var(--r); font-size: 11.5px; animation: rise .18s ease-out; overflow: hidden; }
  .trace-entry .head {
    display: flex; align-items: center; justify-content: space-between; padding: 9px 12px; cursor: pointer;
  }
  .trace-entry .head .q { font-family: var(--sans); color: var(--text-dim); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px; }
  .trace-entry .body { padding: 0 12px 10px; display: none; }
  .trace-entry.open .body { display: block; }
  .trace-entry .row { display: flex; justify-content: space-between; gap: 10px; padding: 4px 0; }
  .trace-entry .row + .row { border-top: 1px dashed var(--line); }
  .trace-entry .label { font-family: var(--mono); color: var(--text-faint); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
  .trace-entry .val { font-family: var(--mono); font-size: 11px; text-align: right; word-break: break-word; }
  .chevron { color: var(--text-faint); font-size: 10px; transition: transform .15s; }
  .trace-entry.open .chevron { transform: rotate(90deg); }

  .empty-state { color: var(--text-faint); font-size: 12px; padding: 20px 2px; line-height: 1.6; }

  @media (prefers-reduced-motion: reduce) { .msg, .trace-entry, .typing-bubble span { animation: none; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="dot"></span>
      <div>
        <h1>Campus Helpdesk</h1>
        <div class="sub">TRIAGE AGENT</div>
      </div>
    </div>
    <span class="status-pill"><span class="dot"></span>Grounded &amp; escalation-aware</span>
  </header>

  <div class="main">
    <div class="chat-col">
      <div class="thread" id="thread"></div>
      <div class="suggestions">
        <button data-q="What are the fee deadlines?">Fee deadline</button>
        <button data-q="What is the attendance requirement?">Attendance rule</button>
        <button data-q="What are the mess timings?">Mess timings</button>
        <button data-q="What are the hostel timings?">Hostel timings</button>
        <button data-q="My hostel room has a leaking tap">Report maintenance</button>
        <button data-q="Can I get a refund for the campus parking fine from last year?">Off-topic (escalates)</button>
      </div>
      <div class="composer">
        <input id="input" type="text" placeholder="Ask about fees, exams, hostel, mess, Wi-Fi, library…" autocomplete="off" />
        <button id="send" aria-label="Send">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M21.44 2.56L2.94 10.6c-.9.4-.88 1.68.03 2.05l6.6 2.68 2.68 6.6c.37.91 1.65.93 2.05.03l8.04-18.5c.35-.8-.45-1.6-1.25-1.25l-.65.35Z"
              stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
            <path d="M9.57 15.33 21.44 2.56" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </div>

    <div class="ledger-col">
      <div class="ledger-header">
        <div>
          <h2>Decision trace</h2>
          <p>What the agent matched, and why</p>
        </div>
        <span class="ledger-count" id="ledgerCount"></span>
      </div>
      <div class="ledger-body" id="ledger">
        <div class="empty-state">Ask a question on the left. Every response — answered, clarified, or escalated — logs its reasoning here. Click an entry to expand it.</div>
      </div>
    </div>
  </div>
</div>

<script>
const sessionId = "demo-" + Math.random().toString(36).slice(2, 10);
const thread = document.getElementById("thread");
const ledger = document.getElementById("ledger");
const ledgerCount = document.getElementById("ledgerCount");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
let traceCount = 0;

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

// Render minimal markdown: **bold** and bare URLs become links. Everything
// else stays escaped/plain — this is not a full markdown parser on purpose.
function renderInline(text) {
  const escaped = esc(text);
  const bolded = escaped.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  return bolded.replace(
    /(https?:\/\/[^\s<]+[^\s<.,)])/g,
    '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>'
  );
}

// Split a reply body from a trailing "(Source: X — Y)" line so the source
// can render as its own pill instead of plain trailing text.
function splitSource(text) {
  const m = String(text ?? "").match(/\n*\(Source:\s*(.+?)\)\s*$/);
  if (!m) return { body: text, source: null };
  return { body: text.slice(0, m.index).trim(), source: m[1].trim() };
}

function addMessage(role, text, status) {
  const msg = document.createElement("div");
  msg.className = "msg " + role;
  if (role === "agent" && status) {
    const tag = document.createElement("span");
    tag.className = "msg-tag " + status;
    tag.textContent = status;
    msg.appendChild(tag);
  }
  const { body, source } = role === "agent" ? splitSource(text) : { body: text, source: null };
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = renderInline(body);
  msg.appendChild(bubble);
  if (source) {
    const pill = document.createElement("span");
    pill.className = "source-pill";
    pill.textContent = source;
    msg.appendChild(pill);
  }
  thread.appendChild(msg);
  thread.scrollTop = thread.scrollHeight;
  return msg;
}

function showTyping() {
  const msg = document.createElement("div");
  msg.className = "msg agent";
  msg.id = "typing-indicator";
  const bubble = document.createElement("div");
  bubble.className = "bubble typing-bubble";
  bubble.innerHTML = "<span></span><span></span><span></span>";
  msg.appendChild(bubble);
  thread.appendChild(msg);
  thread.scrollTop = thread.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById("typing-indicator");
  if (el) el.remove();
}

function addTrace(question, status, data) {
  const empty = ledger.querySelector(".empty-state");
  if (empty) empty.remove();

  traceCount++;
  ledgerCount.textContent = traceCount + (traceCount === 1 ? " entry" : " entries");

  const entry = document.createElement("div");
  entry.className = "trace-entry";

  const head = document.createElement("div");
  head.className = "head";
  head.innerHTML = `
    <span class="q">${esc(question)}</span>
    <span style="display:flex;align-items:center;gap:8px;">
      <span class="msg-tag ${esc(status)}">${esc(status)}</span>
      <span class="chevron">▸</span>
    </span>`;
  head.addEventListener("click", () => entry.classList.toggle("open"));

  let rows = "";
  if (data.source) rows += `<div class="row"><span class="label">Source</span><span class="val">${esc(data.source)}</span></div>`;
  if (data.department) rows += `<div class="row"><span class="label">Dept</span><span class="val">${esc(data.department)}</span></div>`;
  if (data.ticket) {
    rows += `<div class="row"><span class="label">Ticket</span><span class="val">${esc(data.ticket.id)}</span></div>`;
    rows += `<div class="row"><span class="label">Routed to</span><span class="val">${esc(data.ticket.routed_to)}</span></div>`;
    rows += `<div class="row"><span class="label">Reason</span><span class="val">${esc(data.ticket.reason_for_escalation)}</span></div>`;
  }
  if (!rows) rows = `<div class="row"><span class="label">Note</span><span class="val">No additional detail returned</span></div>`;

  const body = document.createElement("div");
  body.className = "body";
  body.innerHTML = rows;

  entry.appendChild(head);
  entry.appendChild(body);
  ledger.prepend(entry);
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  addMessage("user", text);
  input.value = "";
  sendBtn.disabled = true;
  showTyping();

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    if (!res.ok) throw new Error("bad status " + res.status);
    const data = await res.json();
    hideTyping();
    addMessage("agent", data.reply, data.status);
    addTrace(text, data.status, data);
  } catch (err) {
    hideTyping();
    addMessage("agent", "Connection error — is the server running?", "escalated");
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
document.querySelectorAll(".suggestions button").forEach((btn) => {
  btn.addEventListener("click", () => { input.value = btn.dataset.q; send(); });
});

addMessage("agent", "Hi — I'm the campus helpdesk agent. Ask me about fees, exams, attendance, hostel, mess, Wi-Fi, or library info. If I'm not sure, I'll route you to the right team instead of guessing.");
input.focus();
</script>
</body>
</html>
