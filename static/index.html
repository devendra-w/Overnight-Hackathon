<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Campus Helpdesk — Triage</title>
<style>
  :root {
    --bg: #0b0d10;
    --panel: #121519;
    --panel-2: #15181d;
    --line: #22262c;
    --text: #e7e9ec;
    --text-dim: #8b929c;
    --text-faint: #565d67;
    --accent: #5fd0a3;
    --amber: #e0a94d;
    --red: #e2685f;
    --mono: "SF Mono", "IBM Plex Mono", "Menlo", monospace;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --r: 8px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    display: grid;
    grid-template-rows: auto 1fr;
    height: 100vh;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 3px rgba(95,208,163,0.15);
  }
  header h1 {
    font-size: 14px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header .sub {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-faint);
    letter-spacing: 0.04em;
  }
  .status-pill {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 4px 10px 4px 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .status-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }

  .main {
    display: grid;
    grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr);
    min-height: 0;
  }
  @media (max-width: 860px) {
    .main { grid-template-columns: 1fr; }
    .ledger-col { display: none; }
  }

  .chat-col { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
  .thread {
    flex: 1;
    overflow-y: auto;
    padding: 22px 22px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .thread::-webkit-scrollbar { width: 8px; }
  .thread::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .msg { max-width: 72%; display: flex; flex-direction: column; gap: 5px; animation: rise .18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.agent { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 10px 14px;
    border-radius: var(--r);
    font-size: 13.5px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .msg.user .bubble { background: var(--accent); color: #06110c; border-bottom-right-radius: 2px; font-weight: 500; }
  .msg.agent .bubble { background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 2px; }
  .msg-tag {
    font-family: var(--mono);
    font-size: 9.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 1px 6px;
    border-radius: 3px;
    opacity: 0.85;
  }
  .msg-tag.answered { color: var(--accent); background: rgba(95,208,163,0.1); }
  .msg-tag.clarifying { color: var(--amber); background: rgba(224,169,77,0.1); }
  .msg-tag.escalated { color: var(--red); background: rgba(226,104,95,0.1); }

  .suggestions {
    padding: 10px 22px;
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    border-top: 1px solid var(--line);
  }
  .suggestions button {
    font-size: 11.5px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 6px 12px;
    cursor: pointer;
    color: var(--text-dim);
    font-family: var(--sans);
    transition: border-color .12s, color .12s;
  }
  .suggestions button:hover { border-color: var(--accent); color: var(--text); }

  .composer {
    padding: 14px 22px 18px;
    display: flex;
    gap: 8px;
  }
  .composer input {
    flex: 1;
    font-size: 13.5px;
    padding: 11px 14px;
    border: 1px solid var(--line);
    border-radius: var(--r);
    font-family: var(--sans);
    background: var(--panel);
    color: var(--text);
  }
  .composer input::placeholder { color: var(--text-faint); }
  .composer input:focus { outline: none; border-color: var(--accent); }
  .composer button {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 600;
    background: var(--accent);
    color: #06110c;
    border: none;
    padding: 0 20px;
    border-radius: var(--r);
    cursor: pointer;
    transition: opacity .12s;
  }
  .composer button:hover { opacity: 0.85; }
  .composer button:disabled { opacity: 0.4; cursor: default; }

  .ledger-col { display: flex; flex-direction: column; min-height: 0; background: var(--panel-2); }
  .ledger-header { padding: 16px 20px 12px; border-bottom: 1px solid var(--line); }
  .ledger-header h2 { font-size: 12.5px; font-weight: 600; margin: 0 0 3px; }
  .ledger-header p { font-family: var(--mono); font-size: 10.5px; color: var(--text-faint); margin: 0; }
  .ledger-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .ledger-body::-webkit-scrollbar { width: 8px; }
  .ledger-body::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

  .trace-entry {
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 10px 12px;
    font-size: 11.5px;
    animation: rise .18s ease-out;
  }
  .trace-entry .row { display: flex; justify-content: space-between; gap: 10px; padding: 2px 0; }
  .trace-entry .row + .row { border-top: 1px dashed var(--line); }
  .trace-entry .label { font-family: var(--mono); color: var(--text-faint); font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
  .trace-entry .val { font-family: var(--mono); font-size: 11px; text-align: right; word-break: break-word; }

  .empty-state {
    color: var(--text-faint);
    font-size: 12px;
    padding: 20px 2px;
    line-height: 1.6;
  }

  @media (prefers-reduced-motion: reduce) {
    .msg, .trace-entry { animation: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="dot"></span>
      <div>
        <h1>Campus Helpdesk</h1>
        <div class="sub">TRIAGE AGENT</div>
      </div>
    </div>
    <span class="status-pill"><span class="dot"></span>Grounded &amp; escalation-aware</span>
  </header>

  <div class="main">
    <div class="chat-col">
      <div class="thread" id="thread"></div>
      <div class="suggestions">
        <button data-q="When is the fee payment deadline?">Fee deadline</button>
        <button data-q="How much attendance do I need for exams?">Attendance rule</button>
        <button data-q="When are hall tickets released?">Hall ticket timing</button>
        <button data-q="My hostel room has a leaking tap">Hostel maintenance</button>
        <button data-q="Can I get a refund for the campus parking fine from last year?">Off-topic (escalates)</button>
      </div>
      <div class="composer">
        <input id="input" type="text" placeholder="Ask about fees, exams, leave, ID cards, hostel…" autocomplete="off" />
        <button id="send">Send</button>
      </div>
    </div>

    <div class="ledger-col">
      <div class="ledger-header">
        <h2>Decision trace</h2>
        <p>What the agent matched, and why</p>
      </div>
      <div class="ledger-body" id="ledger">
        <div class="empty-state">Ask a question on the left. Every response — answered, clarified, or escalated — logs its reasoning here.</div>
      </div>
    </div>
  </div>
</div>

<script>
const sessionId = "demo-" + Math.random().toString(36).slice(2, 10);
const thread = document.getElementById("thread");
const ledger = document.getElementById("ledger");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function addMessage(role, text, status) {
  const msg = document.createElement("div");
  msg.className = "msg " + role;
  if (role === "agent" && status) {
    const tag = document.createElement("span");
    tag.className = "msg-tag " + status;
    tag.textContent = status;
    msg.appendChild(tag);
  }
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  msg.appendChild(bubble);
  thread.appendChild(msg);
  thread.scrollTop = thread.scrollHeight;
}

function addTrace(status, data) {
  const empty = ledger.querySelector(".empty-state");
  if (empty) empty.remove();
  const entry = document.createElement("div");
  entry.className = "trace-entry";

  let rows = `<div class="row"><span class="label">Outcome</span><span class="val msg-tag ${esc(status)}">${esc(status)}</span></div>`;
  if (data.source) rows += `<div class="row"><span class="label">Source</span><span class="val">${esc(data.source)}</span></div>`;
  if (data.department) rows += `<div class="row"><span class="label">Dept</span><span class="val">${esc(data.department)}</span></div>`;
  if (data.ticket) {
    rows += `<div class="row"><span class="label">Ticket</span><span class="val">${esc(data.ticket.id)}</span></div>`;
    rows += `<div class="row"><span class="label">Routed to</span><span class="val">${esc(data.ticket.routed_to)}</span></div>`;
    rows += `<div class="row"><span class="label">Reason</span><span class="val">${esc(data.ticket.reason_for_escalation)}</span></div>`;
  }
  entry.innerHTML = rows;
  ledger.prepend(entry);
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  addMessage("user", text);
  input.value = "";
  sendBtn.disabled = true;

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    if (!res.ok) throw new Error("bad status " + res.status);
    const data = await res.json();
    addMessage("agent", data.reply, data.status);
    addTrace(data.status, data);
  } catch (err) {
    addMessage("agent", "Connection error — is the server running?", "escalated");
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
document.querySelectorAll(".suggestions button").forEach((btn) => {
  btn.addEventListener("click", () => { input.value = btn.dataset.q; send(); });
});

addMessage("agent", "Hi — I'm the campus helpdesk agent. Ask me about fees, exams, attendance, ID cards, or hostel policy. If I'm not sure, I'll route you to the right team instead of guessing.");
input.focus();
</script>
</body>
</html>
