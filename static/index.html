<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Campus Helpdesk Triage Agent</title>
<style>
  :root {
    --ink: #1c2b3a;
    --ink-soft: #3c5064;
    --parchment: #f6f1e6;
    --panel: #ffffff;
    --rule: #d8cfb8;
    --brass: #a9762f;
    --brass-deep: #7d551f;
    --answered: #2f6d4f;
    --clarify: #a9762f;
    --escalated: #a13d3d;
    --mono: "IBM Plex Mono", "Courier New", monospace;
    --serif: "Georgia", "Iowan Old Style", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--parchment);
    color: var(--ink);
    font-family: var(--sans);
    height: 100vh;
    overflow: hidden;
  }
  .app {
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    height: 100vh;
  }
  header.masthead {
    grid-column: 1 / -1;
    border-bottom: 2px solid var(--ink);
    padding: 14px 28px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    background: var(--parchment);
  }
  .masthead h1 {
    font-family: var(--serif);
    font-size: 21px;
    letter-spacing: 0.02em;
    margin: 0;
    font-weight: normal;
  }
  .masthead .stamp {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--brass-deep);
    border: 1px solid var(--brass);
    padding: 3px 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .main-grid { display: contents; }
  .chat-col {
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--rule);
    min-height: 0;
  }
  .thread {
    flex: 1;
    overflow-y: auto;
    padding: 24px 32px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .msg { max-width: 78%; display: flex; flex-direction: column; gap: 4px; }
  .msg.user { align-self: flex-end; align-items: flex-end; }
  .msg.agent { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 12px 16px;
    border-radius: 3px;
    font-size: 14.5px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .msg.user .bubble { background: var(--ink); color: var(--parchment); border-radius: 10px 10px 2px 10px;}
  .msg.agent .bubble { background: var(--panel); border: 1px solid var(--rule); border-radius: 10px 10px 10px 2px; }
  .tag {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 2px 8px;
    border-radius: 2px;
  }
  .tag.answered { color: var(--answered); border: 1px solid var(--answered); }
  .tag.clarifying { color: var(--clarify); border: 1px solid var(--clarify); }
  .tag.escalated { color: var(--escalated); border: 1px solid var(--escalated); }
  .composer {
    border-top: 1px solid var(--rule);
    padding: 16px 28px 20px;
    display: flex;
    gap: 10px;
  }
  .composer input {
    flex: 1;
    font-size: 14.5px;
    padding: 12px 14px;
    border: 1px solid var(--ink-soft);
    border-radius: 3px;
    font-family: var(--sans);
    background: var(--panel);
  }
  .composer input:focus { outline: 2px solid var(--brass); outline-offset: 1px; }
  .composer button {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    background: var(--ink);
    color: var(--parchment);
    border: none;
    padding: 0 22px;
    border-radius: 3px;
    cursor: pointer;
  }
  .composer button:hover { background: var(--brass-deep); }
  .suggestions {
    padding: 0 28px 12px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .suggestions button {
    font-size: 12px;
    background: none;
    border: 1px solid var(--rule);
    border-radius: 20px;
    padding: 6px 14px;
    cursor: pointer;
    color: var(--ink-soft);
    font-family: var(--sans);
  }
  .suggestions button:hover { border-color: var(--brass); color: var(--brass-deep); }

  .ledger-col {
    background: var(--panel);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .ledger-header {
    padding: 18px 24px 10px;
    border-bottom: 1px solid var(--rule);
  }
  .ledger-header h2 {
    font-family: var(--serif);
    font-size: 15px;
    margin: 0 0 4px;
    font-weight: normal;
  }
  .ledger-header p {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    margin: 0;
  }
  .ledger-body {
    flex: 1;
    overflow-y: auto;
    padding: 16px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .trace-entry {
    border-left: 3px solid var(--rule);
    padding: 6px 0 6px 14px;
    font-size: 12.5px;
  }
  .trace-entry.answered { border-color: var(--answered); }
  .trace-entry.clarifying { border-color: var(--clarify); }
  .trace-entry.escalated { border-color: var(--escalated); }
  .trace-entry .row { display: flex; justify-content: space-between; margin-bottom: 3px; }
  .trace-entry .label { font-family: var(--mono); color: var(--ink-soft); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; }
  .trace-entry .val { font-family: var(--mono); font-size: 11px; }
  .empty-state {
    color: var(--ink-soft);
    font-size: 13px;
    padding: 24px 4px;
    line-height: 1.6;
  }
</style>
</head>
<body>
<div class="app">
  <header class="masthead">
    <h1>Campus Helpdesk — Triage Desk</h1>
    <span class="stamp">Grounded · Escalation-Aware</span>
  </header>

  <div class="chat-col">
    <div class="thread" id="thread"></div>
    <div class="suggestions">
      <button data-q="When is the fee payment deadline?">Fee deadline?</button>
      <button data-q="How much attendance do I need for exams?">Attendance rule</button>
      <button data-q="When are hall tickets released?">Hall ticket timing</button>
      <button data-q="My hostel room has a leaking tap">Hostel maintenance</button>
      <button data-q="Can I get a refund for the campus parking fine from last year?">Off-topic (escalates)</button>
    </div>
    <div class="composer">
      <input id="input" type="text" placeholder="Ask about fees, exams, leave, ID cards, hostel…" autocomplete="off" />
      <button id="send">Send</button>
    </div>
  </div>

  <div class="ledger-col">
    <div class="ledger-header">
      <h2>Decision Trace</h2>
      <p>What the agent matched, and why</p>
    </div>
    <div class="ledger-body" id="ledger">
      <div class="empty-state">Ask a question on the left. Every response — answered, clarified, or escalated — logs its reasoning here, the way a staff member reviewing the agent's work would want to see it.</div>
    </div>
  </div>
</div>

<script>
const sessionId = "demo-" + Math.random().toString(36).slice(2, 10);
const thread = document.getElementById("thread");
const ledger = document.getElementById("ledger");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");

function addMessage(role, text) {
  const msg = document.createElement("div");
  msg.className = "msg " + role;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;
  msg.appendChild(bubble);
  thread.appendChild(msg);
  thread.scrollTop = thread.scrollHeight;
}

function addTrace(status, data) {
  if (ledger.querySelector(".empty-state")) ledger.innerHTML = "";
  const entry = document.createElement("div");
  entry.className = "trace-entry " + status;

  let rows = `<div class="row"><span class="label">Outcome</span><span class="tag ${status}">${status}</span></div>`;
  if (data.source) rows += `<div class="row"><span class="label">Source doc</span><span class="val">${data.source}</span></div>`;
  if (data.department) rows += `<div class="row"><span class="label">Department</span><span class="val">${data.department}</span></div>`;
  if (data.ticket) {
    rows += `<div class="row"><span class="label">Ticket</span><span class="val">${data.ticket.id}</span></div>`;
    rows += `<div class="row"><span class="label">Routed to</span><span class="val">${data.ticket.routed_to}</span></div>`;
    rows += `<div class="row"><span class="label">Reason</span><span class="val">${data.ticket.reason_for_escalation}</span></div>`;
  }
  entry.innerHTML = rows;
  ledger.prepend(entry);
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  addMessage("user", text);
  input.value = "";

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    const data = await res.json();
    addMessage("agent", data.reply);
    addTrace(data.status, data);
  } catch (err) {
    addMessage("agent", "Connection error — is the server running?");
  }
}

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });
document.querySelectorAll(".suggestions button").forEach((btn) => {
  btn.addEventListener("click", () => { input.value = btn.dataset.q; send(); });
});

addMessage("agent", "Hi — I'm the campus helpdesk agent. Ask me about fees, exams, attendance, ID cards, or hostel policy. If I'm not sure, I'll route you to the right team instead of guessing.");
</script>
</body>
</html>
